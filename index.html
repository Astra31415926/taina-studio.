<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>taina · арт студія</title>
<meta name="description" content="Арт студія TAINA — малюй орнамент із живою симетрією ×8 прямо всередині коду.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   TAINA · АРТ СТУДІЯ — версія 4
   • Слово порожнє — творча майстерня: чистий холст, розмір поля довільний.
   • Є слово — орнамент-код. Поле й рамка-зебра рахуються ТІЛЬКИ за
     довжиною слова, вручну не змінюються: код читається на кожному кроці.
   • Палітра — лише початок: задає несучий канал (його читає сканер)
     і стартові кольори. Малюєш завжди в ВІЛЬНИХ каналах — галочками
     під картинками каналів. Кожен вільний канал можна інвертувати.
   • Під курсором — бліда (50%) копія того, що ляже. Клік — і лягло.
   Рисунок зберігається відносно центру (одна восьма частина).
   ═══════════════════════════════════════════════════════════════════ */
:root{--ink:#14110e;--panel:#1e1a16;--panel2:#28231d;--line:#40372d;
  --txt:#f2ece2;--muted:#c2b6a4;--acc:#c9a876;--hot:#f0d9a8;--on-acc:#16130f;--bad:#f08273;--ok:#7fdca2;--warn:#f0c062}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--txt);font-family:Inter,Arial,sans-serif;
  display:flex;flex-direction:column;height:100vh;overflow:hidden}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

header{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line)}
header h1{font:700 18px 'JetBrains Mono',monospace;letter-spacing:.06em;color:var(--hot)}
header .sub{color:var(--muted);font-size:13px}
header a{margin-left:auto;color:var(--acc);font:600 13px 'JetBrains Mono',monospace;text-decoration:none}
header a:hover{color:var(--hot)}

.app{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr) 290px}
aside{padding:16px 18px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
main{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}
#stage{flex:1 1 auto;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;touch-action:none;cursor:crosshair;box-shadow:0 14px 44px rgba(0,0,0,.55);border-radius:2px}
#cv.blocked{cursor:not-allowed}

/* три канали: галочка «малювати» і кнопка «інвертувати» */
.chans{flex:0 0 auto;display:flex;gap:14px;justify-content:center}
.chans[hidden]{display:none}
.chan{display:flex;flex-direction:column;align-items:center;gap:6px;width:136px}
.chan canvas{width:112px;height:112px;image-rendering:pixelated;border-radius:4px;display:block;
  border:2px solid var(--line);cursor:pointer}
.chan.car canvas{border-color:var(--acc);cursor:default}
.chan.sel canvas{border-color:#ffb000;box-shadow:0 0 0 2px rgba(255,176,0,.35)}
.chan .cl{font:600 11px 'JetBrains Mono',monospace;color:var(--muted);text-align:center;line-height:1.35}
.chan.car .cl{color:var(--hot)}
.chan .ctl{display:flex;gap:6px;align-items:center}
.chan .ctl[hidden]{display:none}
.chan label{display:flex;align-items:center;gap:6px;font:600 12.5px Inter,Arial,sans-serif;color:var(--txt);cursor:pointer}
.chan label input{width:18px;height:18px;accent-color:#ffb000;cursor:pointer}
.chan .inv{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;
  font:700 14px 'JetBrains Mono',monospace;width:32px;height:28px;cursor:pointer;padding:0}
.chan .inv:hover{border-color:var(--acc);color:var(--hot)}
.chan .inv.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.hint{flex:0 0 auto;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.5}
.hint b{color:var(--txt);font-family:'JetBrains Mono',monospace;font-weight:600}

.sec{display:flex;flex-direction:column;gap:9px}
.sec[hidden]{display:none}
.lbl{font:700 11px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg[hidden]{display:none}
.seg button{flex:1;border:0;border-right:1px solid var(--line);background:var(--panel);color:var(--txt);
  font:700 13px 'JetBrains Mono',monospace;padding:12px 3px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.seg button:hover:not(.on){background:var(--panel2)}

.word{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:11px;
  padding:12px;font:16px 'JetBrains Mono',monospace;outline:none}
.word:focus{border-color:var(--acc)}
.word::placeholder{color:#8f8372}

.sl{display:flex;flex-direction:column;gap:4px}
.sl[hidden]{display:none}
.sl .h{display:flex;justify-content:space-between;font-size:13.5px;color:var(--txt)}
.sl .h b{color:var(--hot);font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.sl input{width:100%;height:30px;accent-color:var(--acc);cursor:pointer}

.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--txt);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--acc);cursor:pointer}

.row{display:flex;gap:8px}
.b{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:11px;
  font:600 13.5px 'JetBrains Mono',monospace;padding:11px 8px;cursor:pointer}
.b[hidden]{display:none}
.b:hover:not(:disabled){border-color:var(--acc);color:var(--hot)}
.b:disabled{opacity:.35;cursor:default}
.b.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}
.b.pri:hover{background:var(--hot);color:var(--on-acc)}
.b.danger:hover{border-color:var(--bad);color:var(--bad)}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.note:empty{display:none}
.note.warn{color:var(--warn)}

/* заготовки й штампи */
.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tpl button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 7px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;font:600 11px 'JetBrains Mono',monospace;line-height:1.2;text-align:center}
.tpl button:hover{border-color:var(--acc);color:var(--hot)}
.tpl button.on{border-color:#ffb000;box-shadow:inset 0 0 0 1px #ffb000;color:var(--hot)}
.tpl canvas{width:40px;height:40px;image-rendering:pixelated;border-radius:5px;display:block}

/* палітри */
.plist{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.plbtn{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--txt);cursor:pointer;text-align:left;font:600 11.5px Inter,Arial,sans-serif;line-height:1.2}
.plbtn:hover{border-color:var(--acc)}
.plbtn.on{border-color:var(--hot);box-shadow:inset 0 0 0 1px var(--hot)}
.chips{display:flex;border-radius:5px;overflow:hidden;border:1px solid var(--line);flex:0 0 auto}
.chips i{display:block;width:11px;height:22px}

.stat{display:flex;flex-direction:column;font-family:'JetBrains Mono',monospace}
.stat div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.stat div:first-child{border-top:1px solid var(--line)}
.stat b{color:var(--hot);font-size:15px}
.verdict{font:600 12.5px 'JetBrains Mono',monospace;padding:11px;border-radius:10px;background:var(--panel2);
  display:flex;flex-direction:column;gap:6px;line-height:1.45}
.verdict .ok{color:var(--ok)} .verdict .bad{color:var(--bad)} .verdict .wr{color:var(--warn)}
.verdict .mu{color:var(--muted);font-weight:400;font-family:Inter,Arial,sans-serif}

@media(max-width:1100px){
  body{height:auto;min-height:100vh;overflow:auto}
  .app{grid-template-columns:1fr}
  aside.left,aside.right{border:0;border-bottom:1px solid var(--line)}
  main{order:-1;height:110vw}
}
</style>
</head>
<body>

<header>
  <h1>TAINA · Арт студія</h1>
  <span class="sub">малюй орнамент — симетрія ×8 наживо</span>
  <a href="https://taina-ten.vercel.app/index.html">← до TAINA</a>
</header>

<div class="app">
  <!-- ЛІВА ПАНЕЛЬ -->
  <aside class="left">
    <div class="sec">
      <span class="lbl">Слово</span>
      <input type="text" class="word" id="word" placeholder="порожньо — чистий холст" spellcheck="false" autocomplete="off">
      <span class="note" id="word-note"></span>
    </div>

    <div class="sec">
      <span class="lbl">Інструмент</span>
      <div class="seg" id="tool">
        <button type="button" data-t="brush" class="on">✎ Кисть</button>
        <button type="button" data-t="eraser">⌫ Гумка</button>
        <button type="button" data-t="stamp">✦ Штамп</button>
      </div>
      <div class="seg" id="layer" hidden>
        <button type="button" data-l="bg">Фон</button>
        <button type="button" data-l="ink">Узор</button>
        <button type="button" data-l="both" class="on">Разом</button>
      </div>
      <span class="note" id="layer-note"></span>
      <label class="sl" id="size-row"><span class="h"><span>Товщина кисті</span><b id="size-v"></b></span>
        <input type="range" id="size" min="1" max="7" step="1"></label>
    </div>

    <div class="sec">
      <span class="lbl">Штампи</span>
      <div class="tpl" id="stamps"></div>
      <label class="sl" id="ss-row"><span class="h"><span>Масштаб штампа</span><b id="ss-v"></b></span>
        <input type="range" id="ss" min="1" max="3" step="1"></label>
    </div>

    <div class="sec">
      <span class="lbl">Заготовка</span>
      <div class="tpl" id="tpl"></div>
      <label class="sl"><span class="h"><span>Крок заготовки</span><b id="k-v"></b></span>
        <input type="range" id="k" min="2" max="9" step="1"></label>
      <button type="button" class="b" id="take" hidden>Взяти малюнок із чистого холста</button>
      <span class="note" id="tpl-note"></span>
    </div>

    <div class="sec">
      <span class="lbl">Полотно</span>
      <label class="sl" id="n-row"><span class="h"><span>Розмір поля</span><b id="n-v"></b></span>
        <input type="range" id="n" min="7" max="79" step="2"></label>
      <span class="note" id="n-note"></span>
      <label class="chk"><input type="checkbox" id="grid">Сітка</label>
      <label class="chk"><input type="checkbox" id="axes">Осі симетрії</label>
    </div>

    <div class="sec">
      <span class="lbl">Дії</span>
      <div class="row">
        <button type="button" class="b" id="undo" title="Ctrl+Z">← Назад</button>
        <button type="button" class="b" id="redo" title="Ctrl+Y">Вперед →</button>
      </div>
      <button type="button" class="b danger" id="clear">Очистити малюнок</button>
    </div>
  </aside>

  <!-- ЦЕНТР -->
  <main>
    <div id="stage"><canvas id="cv"></canvas></div>
    <div class="chans" id="chans" hidden></div>
    <div class="hint" id="hint"></div>
  </main>

  <!-- ПРАВА ПАНЕЛЬ -->
  <aside class="right">
    <div class="sec">
      <span class="lbl">Палітра — початок</span>
      <div class="seg" id="neg">
        <button type="button" data-v="0" class="on">Позитив</button>
        <button type="button" data-v="1">Негатив</button>
      </div>
      <div class="plist" id="plist"></div>
      <span class="note">Палітра задає канал коду і стартові кольори. Далі кольори змінюєш малюнком і кнопками ◐ під каналами.</span>
    </div>

    <div class="sec">
      <span class="lbl">Перевірка коду</span>
      <div class="verdict" id="verdict"></div>
    </div>

    <div class="sec">
      <span class="lbl">Збереження</span>
      <label class="sl"><span class="h"><span>Клітинка в картинці</span><b id="ex-v"></b></span>
        <input type="range" id="ex" min="4" max="48" step="1"></label>
      <label class="sl"><span class="h"><span>Поле навколо</span><b id="mg-v"></b></span>
        <input type="range" id="mg" min="0" max="8" step="1"></label>
      <button type="button" class="b pri" id="save">⤓ Зберегти картинку</button>
      <span class="note" id="ex-size"></span>
    </div>

    <div class="stat">
      <div><span>Поле</span><b id="st-n">—</b></div>
      <div><span>Намальовано клітинок</span><b id="st-c">0</b></div>
    </div>
  </aside>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var enc=new TextEncoder(), decF=new TextDecoder('utf-8',{fatal:true});
var CHN='RGB';

/* ═══ МЕЖІ ═══ 79×79 — найбільше поле для 100 байт (як на сайті) */
var MIN_N=7, MAX_N=79, MAX_R=(MAX_N-1)/2, BYTE_MAX=100;

/* ═══ ПАЛІТРИ — копія з сайту TAINA (12 поєднань) ═══
   Тепер палітра — тільки початок: c — несучий канал (його читає сканер),
   bg/ink — стартові кольори поля й нитки. З кольорів палітри беруться
   два рівні яскравості для кожного вільного каналу; якщо рівень один,
   другим стає протилежний край (0 або 255). sv — печатка в центрі. */
var PALS=[
 {uk:'Традиційні',items:[
  {uk:'Чорно-біла',c:1,bg:[12,12,12],ink:[250,250,250],ai:[250,250,12],ab:[250,12,12],sv:[250,12,12]},
  {uk:'Червоно-чорна',c:0,bg:[0,0,0],ink:[195,0,0],ai:[195,152,0],ab:[0,0,0],sv:[0,0,0]},
  {uk:'Синьо-біла',c:2,bg:[0,0,0],ink:[0,0,255],ai:[0,255,255],ab:[0,0,0],sv:[0,0,0]},
  {uk:'Коричнево-жовта',c:1,bg:[59,36,0],ink:[254,217,0],ai:[254,217,0],ab:[254,36,0],sv:[254,36,0]}]},
 {uk:'Контрастні',items:[
  {uk:'Зелена на індиго',c:1,bg:[0,11,0],ink:[0,218,0],ai:[255,218,0],ab:[0,11,0],sv:[0,11,0]},
  {uk:'Кремово-зелена',c:0,bg:[10,41,12],ink:[255,215,140],ai:[255,41,12],ab:[10,215,140],sv:[10,41,12]},
  {uk:'Зелено-червона',c:0,bg:[0,255,0],ink:[206,0,0],ai:[206,255,237],ab:[0,0,0],sv:[0,0,0]}]},
 {uk:'Яскраві',items:[
  {uk:'Бірюзово-коралова',c:0,bg:[0,6,128],ink:[228,224,128],ai:[228,6,128],ab:[0,6,128],sv:[0,6,137]},
  {uk:'Бордова',c:1,bg:[24,0,48],ink:[24,236,254],ai:[255,236,48],ab:[255,0,48],sv:[255,0,48]},
  {uk:'Червоно-синя',c:0,bg:[0,11,62],ink:[255,11,62],ai:[255,245,244],ab:[0,11,62],sv:[0,11,62]}]},
 {uk:'Спеціальні',items:[
  {uk:'Неонова',c:1,bg:[0,8,40],ink:[0,255,40],ai:[255,255,0],ab:[255,8,0],sv:[0,8,40]},
  {uk:'Золота',c:1,bg:[0,255,255],ink:[0,0,255],ai:[0,0,255],ab:[255,255,0],sv:[0,255,255]}]}
];
var FLAT=[];
PALS.forEach(function(g){g.items.forEach(function(p){p.group=g.uk;FLAT.push(p);});});

/* ═══ ЗАГОТОВКИ ═══ правило залежить лише від пари відстаней від центру */
var MOTIFS=[
  {k:'rhomb', uk:'Ромби',     f:function(a,b){return a+b;}},
  {k:'square',uk:'Рамки',     f:function(a,b){return Math.max(a,b);}},
  {k:'medal', uk:'Медальйон', f:function(a,b){return Math.round(Math.hypot(a,b));}},
  {k:'cross', uk:'Хрести',    f:function(a,b){return Math.abs(a-b);}},
  {k:'plus',  uk:'Плюс',      f:function(a,b){return Math.min(a,b);}}
];

/* ═══ ШТАМПИ ═══ прості пиксельні форми базових українських мотивів,
   намальовані з нуля. X — клітинка штампа, центр — середня клітинка.
   Направлені елементи віддзеркалюються самі в кожному секторі. */
function starRows(){var r=[],N=11,c=5;
  for(var y=0;y<N;y++){var s='';for(var x=0;x<N;x++){var dx=Math.abs(x-c),dy=Math.abs(y-c);
    /* квадрат + ромб = восьмикутна зірка; у середині — віконце з крапкою */
    var on=(Math.max(dx,dy)<=3||dx+dy<=5)&&!(dx+dy>=1&&dx+dy<=2);
    s+=on?'X':'.';}r.push(s);} return r;}
var STAMPS=[
 {k:'rh',   uk:'Ромбик',      r:['..X..','.X.X.','X...X','.X.X.','..X..']},
 {k:'rhf',  uk:'Ромб',        r:['..X..','.XXX.','XXXXX','.XXX.','..X..']},
 {k:'seed', uk:'Засіяне поле',r:['...X...','..X.X..','.X...X.','X..X..X','.X...X.','..X.X..','...X...']},
 {k:'star', uk:'Зірка',       r:starRows()},
 {k:'cr',   uk:'Хрестик',     r:['..X..','..X..','XXXXX','..X..','..X..']},
 {k:'x',    uk:'Косий хрест', r:['X...X','.X.X.','..X..','.X.X.','X...X']},
 {k:'horn', uk:'Ріжки',       r:['XX...XX','X.X.X.X','..XXX..','...X...','...X...']},
 {k:'hook', uk:'Гачок',       r:['XXXX.','...X.','.X.X.','.XXX.','.....']},
 {k:'tree', uk:'Ялинка',      r:['X..X..X','.X.X.X.','..XXX..','X..X..X','.X.X.X.','..XXX..','...X...']},
 {k:'tooth',uk:'Вовчі зуби',  r:['XXXXXXX','.XXXXX.','..XXX..','...X...']},
 {k:'flow', uk:'Квіточка',    r:['..X..','.XXX.','XX.XX','.XXX.','..X..']},
 {k:'dot',  uk:'Крапки',      r:['X.X','...','X.X']}
];

/* ═══ СТАН ═══
   free — малюнок чистого холста.
   ch['0z'] … ch['2o'] — малюнок у вільних каналах: канал (0 R, 1 G, 2 B)
   + шар (z — нулі «Фон», o — одиниці «Узор»). Клітинка в наборі —
   у цьому каналі вона перемкнена на інший рівень яскравості.
   Ключ клітинки — пара відстаней від центру «більша,менша». */
var S={n:25,tool:'brush',layer:'both',size:1,grid:true,axes:true,ex:20,mg:2,word:'',pal:1,neg:false,k:4,
  stamp:'rh',ss:1,chs:[true,true,true],inv:[false,false,false]};
var M={free:new Set(),ch:{}};
function clampN(v){v=Math.round(+v)||25;if(v%2===0)v++;return Math.max(MIN_N,Math.min(MAX_N,v));}
function chSet(f,L){var k=f+L;return M.ch[k]||(M.ch[k]=new Set());}
function chHas(f,L,key){var s=M.ch[f+L];return !!(s&&s.has(key));}
function chAny(){for(var k in M.ch)if(M.ch[k].size)return true;return false;}
function chPlain(){var o={};for(var k in M.ch)if(M.ch[k].size)o[k]=Array.from(M.ch[k]).sort();return o;}

/* ═══ КОЛЬОРИ ═══ */
function P(){return FLAT[S.pal];}
function colors(){
  var p=P(), NEG=S.neg, c1=NEG?p.bg:p.ink, c0=NEG?p.ink:p.bg;
  var ch=p.c, dk=(c0[ch]<=c1[ch])?c0:c1, lt=(dk===c0)?c1:c0;
  return {c1:c1,c0:c0,qz:NEG?dk:lt,o1:NEG?lt:dk,o2:NEG?dk:lt};
}
/* два рівні вільного каналу f */
function levels(f){
  var p=P(),s={};[p.bg,p.ink,p.ai,p.ab].forEach(function(c){s[c[f]]=1;});
  var L=Object.keys(s).map(Number).sort(function(a,b){return a-b;});
  if(L.length<2)L=[L[0],L[0]<128?255:0].sort(function(a,b){return a-b;});
  return [L[0],L[L.length-1]];
}
function other(f,v){var L=levels(f);return (Math.abs(v-L[0])<=Math.abs(v-L[1]))?L[1]:L[0];}
function freeCh(){var c=P().c;return [0,1,2].filter(function(f){return f!==c;});}
function selCh(){return freeCh().filter(function(f){return S.chs[f];});}
function invAny(){return freeCh().some(function(f){return S.inv[f];});}
function sealCol(col){var o=P().sv.slice(),k=P().c;o[k]=col[k];return o;}
function same(a,b){return a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2];}
function css(a){return 'rgb('+a[0]+','+a[1]+','+a[2]+')';}
function lum(a){return .299*a[0]+.587*a[1]+.114*a[2];}
function mix(a,b,t){return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)];}

/* ═══ СЛОВО → ОРНАМЕНТ ═══ 1 клітинка = 1 біт UTF-8, октант ×8.
   Розмір поля — найменший, у який слово вміщається: рамка-зебра
   визначається тільки довжиною слова. */
function cap(n){var R=(n-1)/2;return (R+1)*(R+2)/2;}
function pickN(bits){for(var n=MIN_N;n<=MAX_N;n+=2)if(cap(n)>=bits)return n;return MAX_N;}
var WC={key:null};
function wordInfo(){
  if(!S.word)return null;
  if(WC.key===S.word)return WC;
  var by=enc.encode(S.word),bits=[];
  for(var i=0;i<by.length;i++)for(var b=7;b>=0;b--)bits.push((by[i]>>b)&1);
  var n=pickN(bits.length), c=(n-1)/2, g=new Uint8Array(n*n), idx=0;
  for(var a=0;a<=c;a++)for(var bb=0;bb<=a;bb++){
    if(idx<bits.length&&bits[idx]){
      [[a,bb],[bb,a],[-a,bb],[-bb,a],[a,-bb],[bb,-a],[-a,-bb],[-bb,-a]].forEach(function(q){g[(c+q[1])*n+c+q[0]]=1;});
    }
    idx++;
  }
  WC={key:S.word,n:n,g:g,bytes:by.length};
  return WC;
}
function N(){var w=wordInfo();return w?w.n:S.n;}
function keyN(x,y,n){var c=(n-1)/2,a=Math.abs(x-c),b=Math.abs(y-c);return a>=b?a+','+b:b+','+a;}
/* ПЕЧАТКА: щойно вільні канали перестали бути простою копією коду
   (малюнок або інверсія), центр 5×5 у вільних каналах робимо рівним —
   тоді сканер не прочитає там випадкового сміття. */
function sealOn(){return !!wordInfo()&&(chAny()||invAny());}
function inSeal(x,y,n){var c=(n-1)/2;return Math.abs(x-c)<=2&&Math.abs(y-c)<=2;}

/* ═══ КАРТА КОЛЬОРІВ ═══ одна для екрана, каналів, перевірки й збереження.
   Будова коду — як на сайті: тиха зона 2 → темне кільце → світле → зебра → поле.
   Малюнок, печатка й інверсія — тільки в полі даних і тільки у вільних каналах;
   рамка й тиха зона не змінюються, по них сканер знаходить код. */
function matrix(){
  var W=wordInfo(), C=colors(), n, T, cells, x, y, cnt=0;
  if(!W){
    n=S.n; cells=new Array(n*n);
    for(y=0;y<n;y++)for(x=0;x<n;x++){var hit=M.free.has(keyN(x,y,n));if(hit)cnt++;cells[y*n+x]=hit?C.c1:C.c0;}
    return {T:n,off:0,n:n,cells:cells,word:false,C:C,cnt:cnt};
  }
  n=W.n; var CW=n+6; T=CW+4; cells=new Array(T*T);
  var so=sealOn(), fr=freeCh();
  for(var i=0;i<T*T;i++)cells[i]=C.qz;
  for(y=0;y<CW;y++)for(x=0;x<CW;x++){
    var r=Math.min(x,y,CW-1-x,CW-1-y), col;
    if(r===0)col=C.o1;
    else if(r===1)col=C.o2;
    else if(r===2)col=((x+y)%2===0)?C.o1:C.o2;
    else{
      var dx=x-3, dy=y-3, on=W.g[dy*n+dx], kk=keyN(dx,dy,n), base=on?C.c1:C.c0, L=on?'o':'z', drawn=false;
      col=base.slice();
      fr.forEach(function(f){if(chHas(f,L,kk)){col[f]=other(f,base[f]);drawn=true;}});
      if(drawn)cnt++;
      if(so&&inSeal(dx,dy,n))col=sealCol(base);
      fr.forEach(function(f){if(S.inv[f])col[f]=other(f,col[f]);});
    }
    cells[(y+2)*T+(x+2)]=col;
  }
  return {T:T,off:5,n:n,cells:cells,word:true,C:C,cnt:cnt};
}

/* ═══ ПЕРЕВІРКА ═══
   1) несучий канал читаємо з готових кольорів і розшифровуємо назад;
   2) кожен вільний канал теж пробуємо прочитати: там не має бути
      випадкового тексту, відмінного від слова. Це перевірка файлу,
      а не камери: остаточно перевіряй сканером на сайті. */
function readChan(Mx,ch,hi,lo){
  var n=Mx.n,T=Mx.T,c=(n-1)/2,bits=[];
  for(var a=0;a<=c;a++)for(var b=0;b<=a;b++){
    var v=Mx.cells[(c+b+5)*T+(c+a+5)][ch];bits.push((Math.abs(v-hi)<Math.abs(v-lo))?1:0);}
  var by=[];for(var i=0;i+7<bits.length;i+=8){var q=0;for(var k=0;k<8;k++)q=(q<<1)|bits[i+k];by.push(q);}
  while(by.length&&by[by.length-1]===0)by.pop();
  if(!by.length)return null;
  var t=null;try{t=decF.decode(new Uint8Array(by));}catch(e){return null;}
  for(var j=0;j<t.length;j++){var o=t.charCodeAt(j);if(o<32&&t[j]!=='\n'&&t[j]!=='\t')return null;}
  return t;
}
function verify(Mx){
  var W=wordInfo(); if(!W)return null;
  var n=W.n, T=Mx.T, ch=P().c, hi=Mx.C.c1[ch], lo=Mx.C.c0[ch], bad=0, x, y;
  for(y=0;y<n;y++)for(x=0;x<n;x++){
    var v=Mx.cells[(y+5)*T+(x+5)][ch];
    if(((Math.abs(v-hi)<Math.abs(v-lo))?1:0)!==W.g[y*n+x])bad++;
  }
  var txt=readChan(Mx,ch,hi,lo), junk=[];
  /* вільний канал читаємо так, як підказує його рамка: «одиниця» — колір
     нитки в цьому каналі. Якщо в рамці канал рівний (нитка й поле однакові),
     сканер у ньому коду не знайде — такий канал не перевіряємо. */
  freeCh().forEach(function(f){
    var h1=Mx.C.c1[f], l1=Mx.C.c0[f];
    if(h1===l1)return;
    var t=readChan(Mx,f,h1,l1);
    if(t&&t!==S.word)junk.push(CHN[f]);
  });
  return {bad:bad,total:n*n,text:txt,ok:bad===0&&txt===S.word,junk:junk};
}

/* ═══ ЕКРАН ═══ */
var cv=$('cv'), g=cv.getContext('2d');
var cs=10, dpr=1, hover=null, drawing=false, strokeErase=false, last=null, changed=false, curT=0;
function fit(){
  var Mx=matrix(), st=$('stage');
  var av=Math.max(140,Math.min(st.clientWidth,st.clientHeight)-6);
  cs=Math.max(2,Math.floor(av/Mx.T));
  var px=cs*Mx.T;
  dpr=Math.min(3,window.devicePixelRatio||1);
  cv.style.width=cv.style.height=px+'px';
  cv.width=cv.height=Math.round(px*dpr);
  curT=Mx.T;
  draw(Mx);
}
function brushCells(x,y,n){
  var out=[],h=Math.floor((S.size-1)/2);
  for(var dy=-h;dy<S.size-h;dy++)for(var dx=-h;dx<S.size-h;dx++){
    var X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<n&&Y<n)out.push([X,Y]);}
  return out;
}
function curStamp(){for(var i=0;i<STAMPS.length;i++)if(STAMPS[i].k===S.stamp)return STAMPS[i];return STAMPS[0];}
function stampCells(x,y,n){
  var st=curStamp(), R=st.r, h=R.length, w=R[0].length, cy=Math.floor(h/2), cx=Math.floor(w/2),
      s=S.ss, o=Math.floor((s-1)/2), out=[];
  for(var py=0;py<h;py++)for(var px=0;px<w;px++){
    if(R[py][px]!=='X')continue;
    for(var sy=0;sy<s;sy++)for(var sx=0;sx<s;sx++){
      var X=x+(px-cx)*s+sx-o, Y=y+(py-cy)*s+sy-o;
      if(X>=0&&Y>=0&&X<n&&Y<n)out.push([X,Y]);
    }
  }
  return out;
}
function toolCells(x,y,n){return S.tool==='stamp'?stampCells(x,y,n):brushCells(x,y,n);}

/* ПРИВИД: тимчасово «малюємо» під курсором, беремо картинку і повертаємо
   все як було. На холсті — суміш 50/50 між тим, що є, і тим, що ляже. */
function cloneM(){var c={free:new Set(M.free),ch:{}};for(var k in M.ch)c.ch[k]=new Set(M.ch[k]);return c;}
function ghostMatrix(){
  if(!hover||drawing||blocked())return null;
  var bk=cloneM(), ch0=changed, er0=strokeErase;
  strokeErase=(S.tool==='eraser');
  applyCells(toolCells(hover[0],hover[1],N()));
  var Mx=matrix();
  M=bk;changed=ch0;strokeErase=er0;
  return Mx;
}
function draw(Mx){
  Mx=Mx||matrix();
  if(Mx.T!==curT){fit();return;}
  var T=Mx.T, n=Mx.n, off=Mx.off, i, x, y, Gx=ghostMatrix();
  g.setTransform(dpr,0,0,dpr,0,0);
  for(y=0;y<T;y++)for(x=0;x<T;x++){
    var a=Mx.cells[y*T+x], b=Gx?Gx.cells[y*T+x]:null;
    g.fillStyle=css((b&&!same(a,b))?mix(a,b,.5):a);g.fillRect(x*cs,y*cs,cs,cs);
  }
  var dark=lum(Mx.C.c0)<128, x0=off*cs, x1=(off+n)*cs;
  if(S.grid&&cs>=5){
    g.strokeStyle=dark?'rgba(255,255,255,.13)':'rgba(0,0,0,.14)';g.lineWidth=1/dpr;g.beginPath();
    for(i=1;i<n;i++){var v=x0+i*cs;g.moveTo(v,x0);g.lineTo(v,x1);g.moveTo(x0,v);g.lineTo(x1,v);}
    g.stroke();
  }
  if(S.axes){
    var m=(x0+x1)/2;g.strokeStyle='rgba(255,106,61,.6)';g.lineWidth=1.2;g.setLineDash([5,4]);g.beginPath();
    g.moveTo(m,x0);g.lineTo(m,x1);g.moveTo(x0,m);g.lineTo(x1,m);
    g.moveTo(x0,x0);g.lineTo(x1,x1);g.moveTo(x1,x0);g.lineTo(x0,x1);
    g.stroke();g.setLineDash([]);
  }
  /* тонка рамочка лише навколо самого курсора — щоб було видно, де ти */
  if(hover&&!drawing){
    var tc=toolCells(hover[0],hover[1],n);
    if(tc.length){var mnx=1e9,mny=1e9,mxx=-1,mxy=-1;
      tc.forEach(function(p){mnx=Math.min(mnx,p[0]);mny=Math.min(mny,p[1]);mxx=Math.max(mxx,p[0]);mxy=Math.max(mxy,p[1]);});
      g.strokeStyle=dark?'rgba(255,255,255,.55)':'rgba(0,0,0,.5)';g.lineWidth=1;
      g.strokeRect((mnx+off)*cs+.5,(mny+off)*cs+.5,(mxx-mnx+1)*cs-1,(mxy-mny+1)*cs-1);}
  }
  drawChans(Mx);
  verdict(Mx);
  $('st-n').textContent=n+'×'+n;$('st-c').textContent=Mx.cnt;
}

/* три канали — як їх бачить сканер */
function drawChans(Mx){
  var box=$('chans');
  if(!Mx.word){box.hidden=true;return;}
  box.hidden=false;
  if(box.children.length!==3){
    box.innerHTML='';
    for(var c=0;c<3;c++){(function(ch){
      var d=document.createElement('div');d.className='chan';
      d.innerHTML='<canvas></canvas><span class="cl"></span><div class="ctl"><label><input type="checkbox"><span></span></label>'+
        '<button type="button" class="inv" title="Інвертувати канал">◐</button></div>';
      d.querySelector('input').onchange=function(e){S.chs[ch]=e.target.checked;save();syncLayer();draw();};
      d.querySelector('canvas').onclick=function(){if(ch===P().c)return;S.chs[ch]=!S.chs[ch];save();syncLayer();draw();};
      d.querySelector('.inv').onclick=function(){S.inv[ch]=!S.inv[ch];save();draw();};
      box.appendChild(d);})(c);}
  }
  var T=Mx.T, car=P().c, k=Math.max(1,Math.floor(224/T));
  for(var ch=0;ch<3;ch++){
    var d2=box.children[ch], cvs=d2.querySelector('canvas'), isCar=(ch===car);
    d2.classList.toggle('car',isCar);
    d2.classList.toggle('sel',!isCar&&S.chs[ch]);
    d2.querySelector('.cl').innerHTML=CHN[ch]+(isCar?' · несучий<br>тут код':' · вільний<br>тут малюнок');
    d2.querySelector('.ctl').hidden=isCar;
    d2.querySelector('input').checked=!isCar&&S.chs[ch];
    d2.querySelector('label span').textContent='малювати';
    d2.querySelector('.inv').classList.toggle('on',!isCar&&S.inv[ch]);
    cvs.width=cvs.height=T*k;var x2=cvs.getContext('2d');
    for(var y=0;y<T;y++)for(var x=0;x<T;x++){var v=Mx.cells[y*T+x][ch];x2.fillStyle='rgb('+v+','+v+','+v+')';x2.fillRect(x*k,y*k,k,k);}
  }
}
function verdict(Mx){
  var el=$('verdict');
  if(!Mx.word){el.innerHTML='<span class="mu">Творча майстерня — коду немає. Впиши слово ліворуч, щоб малювати всередині орнаменту.</span>';return;}
  var r=verify(Mx), ch=CHN[P().c];
  var h='';
  h+=r.bad===0?'<span class="ok">✓ Код не зачеплено: канал '+ch+' збігається з кодом у всіх '+r.total+' клітинках</span>'
              :'<span class="bad">✗ Канал '+ch+' змінено в '+r.bad+' клітинках</span>';
  h+=r.ok?'<span class="ok">✓ Розшифровується: «'+esc(r.text)+'»</span>':'<span class="bad">✗ Не розшифровується</span>';
  h+=r.junk.length?'<span class="wr">⚠ У каналі '+r.junk.join(', ')+' читається випадковий текст. Домалюй щось у цьому каналі.</span>'
                  :'<span class="ok">✓ У вільних каналах сміття немає</span>';
  h+='<span class="mu">Це перевірка кольорів файлу. Остаточно перевір готову картинку сканером на сайті TAINA.</span>';
  el.innerHTML=h;
}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ═══ МАЛЮВАННЯ ═══ тільки у відмічених вільних каналах */
function blocked(){return !!wordInfo()&&selCh().length===0;}
function layersL(){return S.layer==='bg'?['z']:S.layer==='ink'?['o']:['z','o'];}
function setAdd(s,k){if(!s.has(k)){s.add(k);changed=true;}}
function setDel(s,k){if(s.delete(k))changed=true;}
function paintKey(k,erase){
  if(!wordInfo()){if(erase)setDel(M.free,k);else setAdd(M.free,k);return;}
  selCh().forEach(function(f){layersL().forEach(function(L){
    var s=chSet(f,L);if(erase)setDel(s,k);else setAdd(s,k);});});
}
function applyCells(list){
  var n=N(),seen={};
  list.forEach(function(p){var k=keyN(p[0],p[1],n);if(seen[k])return;seen[k]=1;paintKey(k,strokeErase);});
}
function cellAt(e){
  var r=cv.getBoundingClientRect(), off=wordInfo()?5:0, n=N();
  var X=Math.floor((e.clientX-r.left)/r.width*curT)-off, Y=Math.floor((e.clientY-r.top)/r.height*curT)-off;
  return (X<0||Y<0||X>=n||Y>=n)?null:[X,Y];
}
function line(a,b){
  var n=N(),x0=a[0],y0=a[1],x1=b[0],y1=b[1];
  var dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx+dy;
  for(;;){applyCells(brushCells(x0,y0,n));if(x0===x1&&y0===y1)break;var e2=2*err;
    if(e2>=dy){err+=dy;x0+=sx;}if(e2<=dx){err+=dx;y0+=sy;}}
}
cv.addEventListener('pointerdown',function(e){
  if(e.button!==0&&e.button!==2)return;
  e.preventDefault();
  if(blocked()){flashNote();return;}
  var c=cellAt(e);if(!c)return;
  strokeErase=(e.button===2)||S.tool==='eraser';changed=false;tplLive=false;syncTpl();
  if(S.tool==='stamp'){
    applyCells(stampCells(c[0],c[1],N()));
    strokeErase=false;
    if(changed){pushHist();save();}
    draw();return;
  }
  drawing=true;last=c;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  applyCells(brushCells(c[0],c[1],N()));draw();
});
cv.addEventListener('pointermove',function(e){
  var c=cellAt(e);
  if(drawing){hover=c;if(c){if(last)line(last,c);last=c;draw();}}
  else{var h=c?c.join(','):'', o=hover?hover.join(','):'';if(h!==o){hover=c;draw();}}
});
function endStroke(){
  if(!drawing)return;
  drawing=false;last=null;strokeErase=false;
  if(changed){pushHist();save();}
  draw();
}
cv.addEventListener('pointerup',endStroke);
cv.addEventListener('pointercancel',endStroke);
cv.addEventListener('pointerleave',function(){if(!drawing&&hover){hover=null;draw();}});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
function flashNote(){var n=$('layer-note');n.classList.remove('warn');void n.offsetWidth;n.classList.add('warn');}

/* ═══ ЗАГОТОВКИ ═══
   На чистому холсті — замінюють малюнок. В орнаменті — замінюють малюнок
   лише у відмічених каналах і в поточному шарі; решта лишається.
   Так можна покласти ромби в R, а рамки в B. */
var lastTpl=null, tplLive=false;
function tplTargets(){
  if(!wordInfo())return [M.free];
  var out=[];selCh().forEach(function(f){layersL().forEach(function(L){out.push(chSet(f,L));});});return out;
}
function applyTpl(m){
  var tg=tplTargets();
  tg.forEach(function(s){s.clear();});
  for(var a=0;a<=MAX_R;a++)for(var b=0;b<=a;b++){
    var r=m.f(a,b);
    if((((r%S.k)+S.k)%S.k)<Math.floor(S.k/2))tg.forEach(function(s){s.add(a+','+b);});
  }
}
function iconCanvas(N2,fn){
  var C=colors(),c=document.createElement('canvas');c.width=c.height=N2;var x=c.getContext('2d');
  for(var y=0;y<N2;y++)for(var X=0;X<N2;X++){x.fillStyle=css(fn(X,y)?C.c1:C.c0);x.fillRect(X,y,1,1);}
  return c;
}
function buildTpl(){
  var box=$('tpl');box.innerHTML='';
  MOTIFS.forEach(function(m){
    var b=document.createElement('button');b.type='button';b.dataset.k=m.k;
    b.appendChild(iconCanvas(15,function(X,y){var r=m.f(Math.abs(X-7),Math.abs(y-7));return (((r%S.k)+S.k)%S.k)<Math.floor(S.k/2);}));
    var sp=document.createElement('span');sp.textContent=m.uk;b.appendChild(sp);
    b.onclick=function(){
      if(blocked()){flashNote();return;}
      applyTpl(m);lastTpl=m;tplLive=true;pushHist();after();
    };
    box.appendChild(b);
  });
  syncTpl();
}
function syncTpl(){Array.prototype.forEach.call($('tpl').children,function(b){b.classList.toggle('on',!!(tplLive&&lastTpl&&b.dataset.k===lastTpl.k));});}
function buildStamps(){
  var box=$('stamps');box.innerHTML='';
  STAMPS.forEach(function(st){
    var b=document.createElement('button');b.type='button';b.dataset.k=st.k;
    var h=st.r.length,w=st.r[0].length,Nn=Math.max(h,w)+2,oy=Math.floor((Nn-h)/2),ox=Math.floor((Nn-w)/2);
    b.appendChild(iconCanvas(Nn,function(X,y){var r=st.r[y-oy];return !!(r&&r[X-ox]==='X');}));
    var sp=document.createElement('span');sp.textContent=st.uk;b.appendChild(sp);
    b.onclick=function(){S.stamp=st.k;S.tool='stamp';save();syncSliders();draw();};
    box.appendChild(b);
  });
  syncStamps();
}
function syncStamps(){Array.prototype.forEach.call($('stamps').children,function(b){b.classList.toggle('on',S.tool==='stamp'&&b.dataset.k===S.stamp);});}
/* малюнок чистого холста — у відмічені канали орнаменту */
$('take').onclick=function(){
  if(blocked()){flashNote();return;}
  var tg=tplTargets();tg.forEach(function(s){s.clear();M.free.forEach(function(k){s.add(k);});});
  tplLive=false;pushHist();after();
};

/* ═══ НАЗАД / ВПЕРЕД ═══ */
var H=[],hp=-1;
function snap(){return JSON.stringify([Array.from(M.free).sort(),chPlain()]);}
function pushHist(){var s=snap();if(H[hp]===s)return;H.splice(hp+1);H.push(s);if(H.length>200)H.shift();hp=H.length-1;syncHist();}
function loadSnap(s){var a=JSON.parse(s);M.free=new Set(a[0]);M.ch={};var o=a[1]||{};for(var k in o)M.ch[k]=new Set(o[k]);}
function undo(){if(hp>0){hp--;loadSnap(H[hp]);tplLive=false;after();}}
function redo(){if(hp<H.length-1){hp++;loadSnap(H[hp]);tplLive=false;after();}}
function syncHist(){$('undo').disabled=hp<=0;$('redo').disabled=hp>=H.length-1;}
$('undo').onclick=undo;$('redo').onclick=redo;
$('clear').onclick=function(){
  var before=snap();
  if(wordInfo())M.ch={};else M.free.clear();
  tplLive=false;
  if(snap()!==before){pushHist();after();}
};

/* ═══ ЗБЕРЕЖЕННЯ ═══ без сітки й осей; кожна клітинка — рівний квадрат
   із цілої кількості пікселів; сторона не більша за 4096 */
function exportDims(){
  var T=matrix().T, Nn=T+2*S.mg, k=S.ex;
  while(k>1&&Nn*k>4096)k--;
  return {T:T,N:Nn,k:k,px:Nn*k};
}
function syncExport(){var d=exportDims();$('ex-size').textContent='Картинка: '+d.px+'×'+d.px+' пікселів';}
$('save').onclick=function(){
  var Mx=matrix(), d=exportDims(), c=document.createElement('canvas');
  c.width=c.height=d.px;
  var x=c.getContext('2d');
  x.fillStyle=css(Mx.word?Mx.C.qz:Mx.C.c0);x.fillRect(0,0,d.px,d.px);
  for(var yy=0;yy<Mx.T;yy++)for(var xx=0;xx<Mx.T;xx++){
    x.fillStyle=css(Mx.cells[yy*Mx.T+xx]);x.fillRect((xx+S.mg)*d.k,(yy+S.mg)*d.k,d.k,d.k);}
  var nm=(S.word||'').trim().slice(0,24).replace(/[^\p{L}\p{N}]+/gu,'_')||(Mx.n+'x'+Mx.n);
  c.toBlob(function(b){
    var a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='taina-studio-'+nm+'.png';a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  },'image/png');
};

/* ═══ ПАЛІТРИ ═══ */
function buildPal(){
  var box=$('plist');box.innerHTML='';
  FLAT.forEach(function(p,i){
    var b=document.createElement('button');b.type='button';b.className='plbtn'+(i===S.pal?' on':'');
    var cl=S.neg?[p.ink,p.bg]:[p.bg,p.ink];
    b.innerHTML='<span class="chips">'+cl.map(function(c){return '<i style="background:'+css(c)+'"></i>';}).join('')+'</span><span></span>';
    b.lastChild.textContent=p.uk;
    b.onclick=function(){S.pal=i;after();buildIcons();};
    box.appendChild(b);
  });
}
function buildIcons(){buildPal();buildTpl();buildStamps();}

/* ═══ ПАНЕЛЬ ═══ */
function syncLayer(){
  var W=wordInfo(), fs=selCh();
  $('layer').hidden=!W;
  $('take').hidden=!W||!M.free.size;
  Array.prototype.forEach.call($('layer').children,function(b){b.classList.toggle('on',b.dataset.l===S.layer);});
  var note='',warn=false;
  if(W&&!fs.length){note='Відміть галочкою хоча б один вільний канал під холстом — у ньому й малюватимеш.';warn=true;}
  else if(W)note='Малюєш у каналі '+fs.map(function(f){return CHN[f];}).join(' і ')+'. «Фон» — нулі, «Узор» — одиниці. Код не змінюється.';
  $('layer-note').textContent=note;
  $('layer-note').classList.toggle('warn',warn);
  $('tpl-note').textContent=W
    ?'Заготовка лягає у відмічені канали й поточний шар і замінює там малюнок. «Назад» поверне як було.'
    :'Заготовка замінює малюнок, далі підправляй кистю. «Назад» поверне як було.';
  cv.classList.toggle('blocked',blocked());
  $('hint').innerHTML='Ліва кнопка миші — малювати, права — стирати. Клавіші: '
    +(W?'<b>1</b> фон, <b>2</b> узор, <b>3</b> разом, ':'')
    +'<b>B</b> кисть, <b>E</b> гумка, <b>S</b> штамп, <b>[</b> <b>]</b> розмір, <b>Ctrl+Z</b> назад.';
}
function plural(v,one,few,many){var m10=v%10,m100=v%100;return v+' '+(m10===1&&m100!==11?one:(m10>=2&&m10<=4&&(m100<12||m100>14))?few:many);}
function syncSliders(){
  var W=wordInfo();
  $('size').value=S.size;$('size-v').textContent=plural(S.size,'клітинка','клітинки','клітинок');
  $('size-row').hidden=(S.tool==='stamp');
  $('ss').value=S.ss;$('ss-v').textContent='×'+S.ss;
  $('n-row').hidden=!!W;
  $('n').value=S.n;$('n-v').textContent=S.n+'×'+S.n;
  $('n-note').textContent=W?('Поле '+W.n+'×'+W.n+' — за довжиною слова. Рамка-зебра підлаштовується сама, щоб код завжди читався.'):'';
  $('k').value=S.k;$('k-v').textContent=S.k;
  $('ex').value=S.ex;$('ex-v').textContent=S.ex+' пікс.';
  $('mg').value=S.mg;$('mg-v').textContent=plural(S.mg,'клітинка','клітинки','клітинок');
  $('grid').checked=S.grid;$('axes').checked=S.axes;
  Array.prototype.forEach.call($('neg').children,function(b){b.classList.toggle('on',(b.dataset.v==='1')===S.neg);});
  Array.prototype.forEach.call($('tool').children,function(b){b.classList.toggle('on',b.dataset.t===S.tool);});
  $('word-note').textContent=W?(W.bytes+' / '+BYTE_MAX+' байт'):'';
  syncStamps();
  syncExport();
}
function after(){save();syncSliders();syncLayer();fit();syncHist();syncTpl();}

/* слово: межа 100 байт, як на сайті; зайве обрізається по символах */
$('word').value=S.word;
$('word').addEventListener('input',function(e){
  var v=e.target.value, out='';
  Array.from(v).some(function(ch){if(enc.encode(out+ch).length>BYTE_MAX)return true;out+=ch;return false;});
  if(out!==v)e.target.value=out;
  S.word=out;WC.key=null;hover=null;after();
});
$('tool').onclick=function(e){var b=e.target.closest('button');if(!b)return;S.tool=b.dataset.t;save();syncSliders();draw();};
$('layer').onclick=function(e){var b=e.target.closest('button');if(!b)return;S.layer=b.dataset.l;save();syncLayer();draw();};
$('neg').onclick=function(e){var b=e.target.closest('button');if(!b)return;S.neg=b.dataset.v==='1';after();buildIcons();};
$('size').oninput=function(e){S.size=+e.target.value;syncSliders();save();};
$('ss').oninput=function(e){S.ss=+e.target.value;syncSliders();save();draw();};
$('n').oninput=function(e){S.n=clampN(e.target.value);syncSliders();fit();save();};
$('k').oninput=function(e){
  S.k=+e.target.value;syncSliders();buildTpl();
  /* заготовка щойно поставлена — перебудовуємо її з новим кроком */
  if(tplLive&&lastTpl){applyTpl(lastTpl);H[hp]=snap();draw();}
  save();
};
$('ex').oninput=function(e){S.ex=+e.target.value;syncSliders();save();};
$('mg').oninput=function(e){S.mg=+e.target.value;syncSliders();save();};
$('grid').onchange=function(e){S.grid=e.target.checked;draw();save();};
$('axes').onchange=function(e){S.axes=e.target.checked;draw();save();};

/* клавіші — за місцем на клавіатурі, тож працюють і на українській розкладці */
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='INPUT'&&e.target.type==='text')return;
  var ctrl=e.ctrlKey||e.metaKey;
  if(ctrl&&e.code==='KeyZ'){e.preventDefault();if(e.shiftKey)redo();else undo();return;}
  if(ctrl&&e.code==='KeyY'){e.preventDefault();redo();return;}
  if(ctrl)return;
  if(e.code==='KeyB'){S.tool='brush';syncSliders();draw();}
  else if(e.code==='KeyE'){S.tool='eraser';syncSliders();draw();}
  else if(e.code==='KeyS'){S.tool='stamp';syncSliders();draw();}
  else if(e.code==='BracketLeft'){
    if(S.tool==='stamp')S.ss=Math.max(1,S.ss-1);else S.size=Math.max(1,S.size-1);syncSliders();save();draw();}
  else if(e.code==='BracketRight'){
    if(S.tool==='stamp')S.ss=Math.min(3,S.ss+1);else S.size=Math.min(7,S.size+1);syncSliders();save();draw();}
  else if(wordInfo()&&(e.code==='Digit1'||e.code==='Digit2'||e.code==='Digit3')){
    S.layer=e.code==='Digit1'?'bg':e.code==='Digit2'?'ink':'both';save();syncLayer();draw();}
});
addEventListener('resize',fit);

buildIcons();pushHist();after();
})();
</script>
</body>
